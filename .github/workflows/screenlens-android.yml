name: ScreenLens Android build

on:
  push:
    paths:
      - "screenlens/**"
      - ".github/workflows/screenlens-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: screenlens-debug-apk
          path: screenlens/app/build/outputs/apk/debug/app-debug.apk
